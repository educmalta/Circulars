<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Deadlines</title>
    <style>
      :root{--brand:#c62828;--muted:#666;--bg:#f7f9fc}
      body{font-family:Inter, 'Segoe UI', Arial, sans-serif; margin:20px;background:var(--bg);color:#222}
      .container{max-width:1000px;margin:0 auto}
      h1{color:var(--brand)}
      table{border-collapse:collapse;width:100%;background:#fff;border-radius:8px;overflow:hidden}
      th,td{border-bottom:1px solid #eee;padding:12px;text-align:left}
      th{background:#fafafa;color:#333}
      a.path-link{color:#0b66d1;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Deadlines</h1>
      <p><a href="/dashboard" style="color:#0b66d1;">Back to Dashboard</a></p>

    <form method="get" action="/deadlines" style="margin:12px 0;display:flex;gap:12px;align-items:center">
      <label for="year">Year:</label>
      <select name="year" id="year" onchange="this.form.submit()">
        <option value="">All</option>
        {% for y in years %}
          <option value="{{ y }}" {% if request.args.get('year') and request.args.get('year')|int==y %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>

      <label for="department">Department:</label>
      <select name="department" id="department" onchange="this.form.submit()">
        <option value="">All</option>
        {% for d in departments %}
          <option value="{{ d }}" {% if request.args.get('department')==d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>

      <a href="/deadlines" style="margin-left:8px">Clear</a>
    </form>

    {% if items|length==0 %}
      <p style="color:#555">No deadlines found for the selected filters.</p>
    {% else %}
    <table>
      <thead><tr><th>File</th><th>Deadline</th><th>Days</th><th>Path</th></tr></thead>
      <tbody>
        {% for it in items %}
        <tr>
          <td style="font-weight:600">{{ it.filename }}</td>
          <td style="color:#b71c1c;font-weight:700">{{ it.best_deadline_display }}</td>
          <td>{{ it.days_distance }}</td>
          <td><a class="path-link" href="{{ it.filepath_url }}" target="_blank" rel="noopener noreferrer" title="{{ it.filepath }}">{{ it.filepath|replace('\\','/') }}</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
  </body>
</html>
